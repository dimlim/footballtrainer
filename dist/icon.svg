<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Football -->
  <g transform="translate(256, 256)">
    <!-- Ball -->
    <circle r="140" fill="white"/>
    
    <!-- Pentagon pattern -->
    <g fill="#1e3a5f">
      <!-- Center pentagon -->
      <path d="M0,-50 L47.5,-15.5 L29.4,40.5 L-29.4,40.5 L-47.5,-15.5 Z" transform="scale(1.2)"/>
      
      <!-- Top pentagon -->
      <path d="M0,-50 L47.5,-15.5 L29.4,40.5 L-29.4,40.5 L-47.5,-15.5 Z" transform="translate(0,-85) scale(0.8)"/>
      
      <!-- Bottom left pentagon -->
      <path d="M0,-50 L47.5,-15.5 L29.4,40.5 L-29.4,40.5 L-47.5,-15.5 Z" transform="translate(-70,55) scale(0.8) rotate(-72)"/>
      
      <!-- Bottom right pentagon -->
      <path d="M0,-50 L47.5,-15.5 L29.4,40.5 L-29.4,40.5 L-47.5,-15.5 Z" transform="translate(70,55) scale(0.8) rotate(72)"/>
      
      <!-- Left pentagon -->
      <path d="M0,-50 L47.5,-15.5 L29.4,40.5 L-29.4,40.5 L-47.5,-15.5 Z" transform="translate(-85,-25) scale(0.8) rotate(-36)"/>
      
      <!-- Right pentagon -->
      <path d="M0,-50 L47.5,-15.5 L29.4,40.5 L-29.4,40.5 L-47.5,-15.5 Z" transform="translate(85,-25) scale(0.8) rotate(36)"/>
    </g>
    
    <!-- Lines connecting pentagons -->
    <g stroke="#1e3a5f" stroke-width="4" fill="none">
      <line x1="0" y1="-60" x2="0" y2="-100"/>
      <line x1="57" y1="-18" x2="95" y2="-30"/>
      <line x1="35" y1="49" x2="60" y2="80"/>
      <line x1="-35" y1="49" x2="-60" y2="80"/>
      <line x1="-57" y1="-18" x2="-95" y2="-30"/>
    </g>
  </g>
  
  <!-- Sparkle/Lightning for "trainer" feel -->
  <g fill="#fbbf24">
    <path d="M420,80 L400,130 L430,120 L410,170 L450,100 L420,110 Z"/>
  </g>
</svg>
