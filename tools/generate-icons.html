<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Icon Generator - Football Trainer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #1e3a5f; text-align: center; }
    .info { 
      background: #e3f2fd; 
      padding: 15px; 
      border-radius: 8px; 
      margin-bottom: 20px;
      text-align: center;
    }
    .icons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .icon-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .icon-card canvas {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .icon-card h3 { margin: 10px 0 5px; color: #333; }
    .icon-card p { margin: 0; color: #666; font-size: 14px; }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .download-btn:hover { background: #2563eb; }
    .download-all {
      display: block;
      width: 100%;
      padding: 15px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
    }
    .download-all:hover { background: #16a34a; }
    #preview {
      text-align: center;
      margin: 20px 0;
    }
    #preview canvas {
      border: 2px solid #3b82f6;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <h1>⚽ Football Trainer - PWA Icon Generator</h1>
  
  <div class="info">
    <p>Цей інструмент генерує PNG іконки для PWA з SVG.</p>
    <p>Натисніть "Завантажити всі іконки" або завантажте окремо кожну.</p>
  </div>

  <div id="preview">
    <h2>Попередній перегляд (512x512)</h2>
    <canvas id="previewCanvas" width="512" height="512"></canvas>
  </div>

  <button class="download-all" onclick="downloadAll()">📥 Завантажити всі іконки (ZIP)</button>

  <div class="icons-grid" id="iconsGrid"></div>

  <script>
    const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];
    
    // Football icon drawing function
    function drawIcon(ctx, size) {
      const scale = size / 512;
      ctx.save();
      ctx.scale(scale, scale);
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, 512, 512);
      gradient.addColorStop(0, '#3b82f6');
      gradient.addColorStop(1, '#1d4ed8');
      
      // Rounded rectangle background
      ctx.beginPath();
      roundRect(ctx, 0, 0, 512, 512, 96);
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Football
      ctx.save();
      ctx.translate(256, 256);
      
      // Ball shadow
      ctx.beginPath();
      ctx.arc(8, 8, 140, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fill();
      
      // Ball
      ctx.beginPath();
      ctx.arc(0, 0, 140, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
      
      // Pentagon pattern
      const pentagonColor = '#1e3a5f';
      
      // Center pentagon
      drawPentagon(ctx, 0, 0, 60, pentagonColor);
      
      // Surrounding pentagons
      const angles = [0, 72, 144, 216, 288];
      const distance = 85;
      angles.forEach((angle, i) => {
        const rad = (angle - 90) * Math.PI / 180;
        const x = Math.cos(rad) * distance;
        const y = Math.sin(rad) * distance;
        drawPentagon(ctx, x, y, 40, pentagonColor, angle);
      });
      
      // Connecting lines
      ctx.strokeStyle = pentagonColor;
      ctx.lineWidth = 4;
      angles.forEach(angle => {
        const rad1 = (angle - 90) * Math.PI / 180;
        const rad2 = (angle - 90) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rad1) * 55, Math.sin(rad1) * 55);
        ctx.lineTo(Math.cos(rad2) * 75, Math.sin(rad2) * 75);
        ctx.stroke();
      });
      
      ctx.restore();
      
      // Lightning bolt (trainer symbol)
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(420, 80);
      ctx.lineTo(395, 135);
      ctx.lineTo(425, 125);
      ctx.lineTo(400, 180);
      ctx.lineTo(455, 105);
      ctx.lineTo(425, 115);
      ctx.closePath();
      ctx.fill();
      
      // Add subtle shine
      ctx.beginPath();
      ctx.arc(256, 256, 140 * scale, -0.5, 0.5);
      const shineGradient = ctx.createRadialGradient(200, 200, 0, 256, 256, 200);
      shineGradient.addColorStop(0, 'rgba(255,255,255,0.3)');
      shineGradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = shineGradient;
      ctx.fill();
      
      ctx.restore();
    }
    
    function drawPentagon(ctx, x, y, size, color, rotation = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation * Math.PI / 180);
      
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i * 72 - 90) * Math.PI / 180;
        const px = Math.cos(angle) * size;
        const py = Math.sin(angle) * size;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      
      ctx.restore();
    }
    
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
    }
    
    // Generate preview
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    drawIcon(previewCtx, 512);
    
    // Generate all icons
    const grid = document.getElementById('iconsGrid');
    const canvases = {};
    
    SIZES.forEach(size => {
      const card = document.createElement('div');
      card.className = 'icon-card';
      
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.id = `icon-${size}`;
      canvases[size] = canvas;
      
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, size);
      
      const title = document.createElement('h3');
      title.textContent = `${size}x${size}`;
      
      const info = document.createElement('p');
      info.textContent = `icon-${size}x${size}.png`;
      
      const btn = document.createElement('a');
      btn.className = 'download-btn';
      btn.textContent = '📥 Завантажити';
      btn.download = `icon-${size}x${size}.png`;
      btn.href = canvas.toDataURL('image/png');
      
      card.appendChild(canvas);
      card.appendChild(title);
      card.appendChild(info);
      card.appendChild(btn);
      grid.appendChild(card);
    });
    
    // Download all as individual files
    async function downloadAll() {
      // Download each icon
      for (const size of SIZES) {
        const canvas = canvases[size];
        const link = document.createElement('a');
        link.download = `icon-${size}x${size}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        // Small delay between downloads
        await new Promise(r => setTimeout(r, 200));
      }
      
      alert('✅ Всі іконки завантажено!\n\nПеремістіть їх у папку:\npublic/icons/');
    }
  </script>
</body>
</html>
